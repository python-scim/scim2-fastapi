[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[project]
name = "scim2-fastapi"
version = "0.0.0"
description = "Painless SCIM integration for FastAPI"
readme = "README.md"
authors = [
    { name = "Éloi Rivard", email = "eloi@yaal.coop" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "scim2-models>=0.12.3",
    "scim2-server>=0.8.3",
]

[project.urls]
documentation = "https://scim2-fastapi.readthedocs.io"
repository = "https://github.com/python-scim/scim2-fastapi"
funding = "https://github.com/sponsors/python-scim"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "prek>=0.5.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "scim2-client>=0.13.2",
    "scim2-server[cursor]>=0.8.3",
    "scim2-tester>=0.5.2",
]
doc = [
    "shibuya>=2026.7.12",
    "sphinx>=9.0.4",
    "sphinx-issues>=6.0.0",
    "sphinx-paramlinks>=0.6.0",
]

[tool.ruff.lint]
select = [
    "B", # flake8-bugbear
    "D", # pydocstyle
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "UP", # pyupgrade
]
ignore = [
    "E501", # line-too-long
    "E722", # bare-except
    "D100", # public module
    "D101", # public class
    "D102", # public method
    "D103", # public function
    "D104", # public package
    "D105", # magic method
    "D106", # nested class
    "D107", # public init
    "D203", # no-blank-line-before-class
    "D213", # multi-line-summary-second-line
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
docstring-code-format = true

[tool.coverage.run]
source = ["scim2_fastapi", "examples", "tests"]

[tool.mypy]
plugins = ["pydantic.mypy"]
files = ["src/scim2_fastapi"]
strict = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--doctest-modules --doctest-glob='*.rst' --ignore=doc/conf.py"
doctest_optionflags= "ALLOW_UNICODE ELLIPSIS"

[tool.uv]
exclude-newer = "14 days"
exclude-newer-package = { scim2-models = false, scim2-client = false, scim2-server = false, scim2-cli = false, scim2-tester = false, pytest-scim2-server = false }
